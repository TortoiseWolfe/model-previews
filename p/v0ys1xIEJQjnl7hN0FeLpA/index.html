<script>
(async () => {
  const status = document.getElementById('status');
  const doc = document.getElementById('doc');
  const raw = atob(doc.textContent.trim());
  let bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) { status.textContent = 'This link is missing its key. Open the full link you were sent.'; return; }
  try {
    const b = atob(k.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((k.length + 3) % 4));
    const key = await crypto.subtle.importKey('raw', Uint8Array.from(b, c => c.charCodeAt(0)), 'AES-GCM', false, ['decrypt']);
    bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12)));
  } catch (e) { status.textContent = "This link's key doesn't open this page."; return; }
  const text = new TextDecoder().decode(bytes);
  if (document.readyState !== 'complete') await new Promise(r => window.addEventListener('load', r));
  document.open(); document.write(text); document.close();
})();
</script>
